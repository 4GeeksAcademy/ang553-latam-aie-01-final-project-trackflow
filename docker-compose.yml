# =============================================================================
# TrackFlow — Docker Compose (Desarrollo con Hot Reload)
# =============================================================================
# Incluye bind mounts para desarrollo y volúmenes nombrados que preservan
# node_modules instalados durante docker build.
# =============================================================================

services:

  # ── Interfaces (Next.js: website + backoffice) ─────────────────────────────
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    ports:
      - "3000:3000"   # website
      - "3001:3001"   # backoffice
    networks:
      - trackflow-dev
    depends_on:
      - api
    environment:
      # Server-side backend URL for Next.js rewrites (Docker DNS)
      - API_BACKEND_URL=${API_BACKEND_URL}
    volumes:
      # Bind mounts de código fuente (host → container)
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      # src/ compartido del monorepo (read-only)
      - ./src:/app/src:ro
      # Volúmenes nombrados para preservar node_modules de la imagen
      - website-node-modules:/app/uis/website/node_modules
      - backoffice-node-modules:/app/uis/backoffice/node_modules

  # ── API (FastAPI) ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - trackflow-dev
    volumes:
      # Bind mounts de código fuente (host → container)
      - ./services:/app/services
      - ./scripts:/app/scripts

  # ── Scheduler (DEV-53 nightly telemetry export) ───────────────────────────
  scheduler:
    profiles:
      - scheduler
    build:
      context: .
      dockerfile: infra/scheduler/Dockerfile
    env_file:
      - .env
    environment:
      - TZ=UTC
    networks:
      - trackflow-dev
    volumes:
      - telemetry-raw:/app/data/raw

  # ── Async task infrastructure (DEV-55 Block A, opt-in) ────────────────────
  redis:
    profiles:
      - async-tasks
    image: redis:7.4.1-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - trackflow-dev
    volumes:
      - celery-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  celery-worker:
    profiles:
      - async-tasks
    build:
      context: .
      dockerfile: services/task_queue/Dockerfile
    command:
      - celery
      - --app
      - services.task_queue.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --events
      - --hostname=trackflow-worker@%h
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow-dev
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app services.task_queue.celery_app:celery_app inspect ping --destination "trackflow-worker@$$HOSTNAME" --timeout 5 | grep -q pong
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  flower:
    profiles:
      - async-tasks
    build:
      context: .
      dockerfile: services/task_queue/Dockerfile
    command:
      - celery
      - --app
      - services.task_queue.celery_app:celery_app
      - flower
      - --port=5555
      - --address=0.0.0.0
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:-}
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - trackflow-dev
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 5555), 3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  trackflow-dev:
    driver: bridge

volumes:
  website-node-modules:
  backoffice-node-modules:
  telemetry-raw:
  celery-redis-data:
