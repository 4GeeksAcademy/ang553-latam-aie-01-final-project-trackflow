# =============================================================================
# TrackFlow — Docker Compose (Desarrollo con Hot Reload)
# =============================================================================
# Incluye bind mounts para desarrollo y volúmenes nombrados que preservan
# node_modules instalados durante docker build.
# =============================================================================

services:

  # ── Interfaces (Next.js: website + backoffice) ─────────────────────────────
  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
    ports:
      - "3000:3000"   # website
      - "3001:3001"   # backoffice
    networks:
      - trackflow-dev
    depends_on:
      - api
    environment:
      # Server-side backend URL for Next.js rewrites (Docker DNS)
      - API_BACKEND_URL=${API_BACKEND_URL:-http://api:8000}
      # Public Authorization Code + PKCE configuration for Support only.
      # Never add a confidential-client secret to the browser environment.
      - NEXT_PUBLIC_SUPPORT_OIDC_AUTHORIZATION_ENDPOINT=${NEXT_PUBLIC_SUPPORT_OIDC_AUTHORIZATION_ENDPOINT:-}
      - NEXT_PUBLIC_SUPPORT_OIDC_TOKEN_ENDPOINT=${NEXT_PUBLIC_SUPPORT_OIDC_TOKEN_ENDPOINT:-}
      - NEXT_PUBLIC_SUPPORT_OIDC_CLIENT_ID=${NEXT_PUBLIC_SUPPORT_OIDC_CLIENT_ID:-}
    volumes:
      # Bind mounts de código fuente (host → container)
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      # src/ compartido del monorepo (read-only)
      - ./src:/app/src:ro
      # Volúmenes nombrados para preservar node_modules de la imagen
      - website-node-modules:/app/uis/website/node_modules
      - backoffice-node-modules:/app/uis/backoffice/node_modules

  # ── API (FastAPI) ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Configuration is coherent with the relay/worker. The API persists to
      # PostgreSQL/outbox and does not contact Redis before returning 202.
      - REDIS_URL=redis://redis:6379/0
      # RAG remains dormant until the opt-in Qdrant service is started and a
      # server-side 4Geeks key is configured.
      - FOUR_GEEKS_BASE_URL=${FOUR_GEEKS_BASE_URL:-https://llm.4geeks.ai/v1}
      - FOUR_GEEKS_API_KEY=${FOUR_GEEKS_API_KEY:-}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-online/openrouter/perplexity/pplx-embed-v1-0.6b}
      - RAG_GENERATION_MODEL=${RAG_GENERATION_MODEL:-online/openrouter/deepseek/deepseek-v4-flash}
      # Always use Docker DNS in-container; the host-side CLI uses 127.0.0.1.
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-trackflow_knowledge}
      - RAG_VECTOR_SIZE=${RAG_VECTOR_SIZE:-1024}
      - RAG_REQUEST_INTERVAL_SECONDS=${RAG_REQUEST_INTERVAL_SECONDS:-2}
      - RAG_TOTAL_BUDGET_SECONDS=${RAG_TOTAL_BUDGET_SECONDS:-80}
      - RAG_EMBEDDING_ATTEMPT_TIMEOUT_SECONDS=${RAG_EMBEDDING_ATTEMPT_TIMEOUT_SECONDS:-25}
      - RAG_EMBEDDING_MIN_RETRY_TIMEOUT_SECONDS=${RAG_EMBEDDING_MIN_RETRY_TIMEOUT_SECONDS:-22}
      - RAG_GENERATION_TIMEOUT_SECONDS=${RAG_GENERATION_TIMEOUT_SECONDS:-20}
      - RAG_QDRANT_TIMEOUT_SECONDS=${RAG_QDRANT_TIMEOUT_SECONDS:-5}
      - RAG_RESPONSE_RESERVE_SECONDS=${RAG_RESPONSE_RESERVE_SECONDS:-3}
      - RAG_RETRY_BACKOFF_SECONDS=${RAG_RETRY_BACKOFF_SECONDS:-0.5}
      - RAG_RETRY_MAX_BACKOFF_SECONDS=${RAG_RETRY_MAX_BACKOFF_SECONDS:-2}
      - RAG_RETRY_JITTER_SECONDS=${RAG_RETRY_JITTER_SECONDS:-0.25}
      - RAG_RETRY_AFTER_CAP_SECONDS=${RAG_RETRY_AFTER_CAP_SECONDS:-5}
      - RAG_EMBEDDING_CACHE_CAPACITY=${RAG_EMBEDDING_CACHE_CAPACITY:-256}
      - RAG_EMBEDDING_CACHE_TTL_SECONDS=${RAG_EMBEDDING_CACHE_TTL_SECONDS:-600}
      - RAG_MIN_SCORE=${RAG_MIN_SCORE:-0.57}
    networks:
      - trackflow-dev
    volumes:
      # Bind mounts de código fuente (host → container)
      - ./services:/app/services
      - ./scripts:/app/scripts
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base:ro

  # ── Scheduler (DEV-53 nightly telemetry export) ───────────────────────────
  scheduler:
    profiles:
      - scheduler
    build:
      context: .
      dockerfile: infra/scheduler/Dockerfile
    env_file:
      - .env
    environment:
      - TZ=UTC
    networks:
      - trackflow-dev
    volumes:
      - telemetry-raw:/app/data/raw

  # ── Async task infrastructure (DEV-55 Block A, opt-in) ────────────────────
  redis:
    profiles:
      - async-tasks
    image: redis:7.4.1-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - trackflow-dev
    volumes:
      - celery-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  celery-worker:
    profiles:
      - async-tasks
    build:
      context: .
      dockerfile: services/task_queue/Dockerfile
    command:
      - /bin/sh
      - -ec
      - >-
        test -n "$$TRACKFLOW_TASK_SOFT_TIME_LIMIT_SECONDS" &&
        test -n "$$TRACKFLOW_TASK_TIME_LIMIT_SECONDS" &&
        test -n "$$TRACKFLOW_VISIBILITY_TIMEOUT_SECONDS" &&
        test -n "$$TRACKFLOW_RESULT_EXPIRES_SECONDS" &&
        test -n "$$TRACKFLOW_TASK_CLAIM_LEASE_SECONDS" &&
        test -n "$$TRACKFLOW_TASK_HEARTBEAT_SECONDS" &&
        test -n "$$TRACKFLOW_TASK_RETRY_MAX_BACKOFF_SECONDS" &&
        test -n "$$TRACKFLOW_WORKER_SHUTDOWN_GRACE_SECONDS" &&
        exec celery --app services.task_queue.celery_app:celery_app worker
        --loglevel=INFO --events --hostname=trackflow-worker@%h
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TRACKFLOW_TASK_SOFT_TIME_LIMIT_SECONDS=${TRACKFLOW_TASK_SOFT_TIME_LIMIT_SECONDS:-}
      - TRACKFLOW_TASK_TIME_LIMIT_SECONDS=${TRACKFLOW_TASK_TIME_LIMIT_SECONDS:-}
      - TRACKFLOW_VISIBILITY_TIMEOUT_SECONDS=${TRACKFLOW_VISIBILITY_TIMEOUT_SECONDS:-}
      - TRACKFLOW_RESULT_EXPIRES_SECONDS=${TRACKFLOW_RESULT_EXPIRES_SECONDS:-}
      - TRACKFLOW_TASK_CLAIM_LEASE_SECONDS=${TRACKFLOW_TASK_CLAIM_LEASE_SECONDS:-}
      - TRACKFLOW_TASK_HEARTBEAT_SECONDS=${TRACKFLOW_TASK_HEARTBEAT_SECONDS:-}
      - TRACKFLOW_TASK_RETRY_MAX_BACKOFF_SECONDS=${TRACKFLOW_TASK_RETRY_MAX_BACKOFF_SECONDS:-}
      - TRACKFLOW_WORKER_SHUTDOWN_GRACE_SECONDS=${TRACKFLOW_WORKER_SHUTDOWN_GRACE_SECONDS:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow-dev
    healthcheck:
      test:
        - CMD-SHELL
        - celery --app services.task_queue.celery_app:celery_app inspect ping --destination "trackflow-worker@$$HOSTNAME" --timeout 5 | grep -q pong
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    # The worker refuses to start when this value is absent. The 30-second
    # interpolation fallback keeps ordinary profile-free Compose parsing valid;
    # it is not an approved async-worker runtime default.
    stop_grace_period: ${TRACKFLOW_WORKER_SHUTDOWN_GRACE_SECONDS:-30}s

  task-relay:
    profiles:
      - async-tasks
    build:
      context: .
      dockerfile: services/task_queue/Dockerfile
    command:
      - python
      - -m
      - services.task_queue.relay
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TRACKFLOW_RELAY_POLL_SECONDS=${TRACKFLOW_RELAY_POLL_SECONDS:-}
      - TRACKFLOW_RELAY_LEASE_SECONDS=${TRACKFLOW_RELAY_LEASE_SECONDS:-}
      - TRACKFLOW_RELAY_MAX_BACKOFF_SECONDS=${TRACKFLOW_RELAY_MAX_BACKOFF_SECONDS:-}
      - TRACKFLOW_RELAY_MAX_PUBLISH_ATTEMPTS=${TRACKFLOW_RELAY_MAX_PUBLISH_ATTEMPTS:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow-dev
    restart: unless-stopped
    stop_grace_period: 30s

  flower:
    profiles:
      - async-tasks
    build:
      context: .
      dockerfile: services/task_queue/Dockerfile
    command:
      - /bin/sh
      - -ec
      - >-
        test -n "$$FLOWER_BASIC_AUTH" &&
        exec celery --app services.task_queue.celery_app:celery_app flower
        --port=5555 --address=0.0.0.0
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:-}
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - trackflow-dev
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 5555), 3).close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # RAG vector store (Milestone 7, opt-in). The version is pinned so a normal
  # Compose run never drifts to an unreviewed Qdrant release.
  qdrant:
    profiles:
      - rag
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - trackflow-dev
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ':> /dev/tcp/127.0.0.1/6333'"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  trackflow-dev:
    driver: bridge

volumes:
  website-node-modules:
  backoffice-node-modules:
  telemetry-raw:
  celery-redis-data:
  qdrant-data:
