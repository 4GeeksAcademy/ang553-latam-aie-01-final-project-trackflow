[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackflow"
version = "0.1.0"
description = "TrackFlow — Logistics platform backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "tinydb>=4.8.0,<5.0.0",
    "python-jose[cryptography]>=3.5.0",
    "pyjwt[crypto]>=2.9,<3",
    "libpass[bcrypt]>=1.9.3",
    "resend>=0.8.0,<1.0.0",
    "sqlmodel>=0.0.22,<1.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.6.0,<2.0.0",
    "scipy>=1.14.0,<2.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "prefect>=3.0.0,<4.0.0",
    "celery[redis]>=5.5.0,<6.0.0",
    "flower>=2.0.1,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "mcp>=1.28,<2",
    "langchain-mcp-adapters==0.3.2",
]

[project.scripts]
seed = "services.api.seed:main"

[tool.setuptools.packages.find]
include = ["agents*", "services.api*", "services.telemetry*", "services.job_runner*", "services.task_queue*", "services.rag*", "pipelines*"]
namespaces = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
