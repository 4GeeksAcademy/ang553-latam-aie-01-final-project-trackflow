[project]
name = "trackflow-mcp-server"
version = "0.1.0"
description = "OAuth-protected MCP server for TrackFlow operational tools"
requires-python = ">=3.10,<4.0"
dependencies = [
    "httpx>=0.28.1,<1.0.0",
    "mcp>=1.28,<2",
    "mcpauth==0.2.0b1",
    "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trackflow_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
